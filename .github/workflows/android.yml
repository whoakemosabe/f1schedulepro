name: Android APK

# Pushes to main publish a signed release (v2.0.N) with f1pro.apk attached; other branches are
# build checks. Docs-only changes don't build.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "licenses/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, for the "What's new" list in the release notes.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::KEYSTORE_B64 / KEYSTORE_PASSWORD secrets are missing; refusing to publish a build with the wrong key."
              exit 1
            fi
            echo "No signing secrets: debug-signed check build."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/f1pro-release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/f1pro-release.p12" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Refresh the bundled calendar
        # Fresh installs start with the real calendar even offline. Keeps the committed copy if
        # the feed is down or a season isn't published yet. Tests use a fixed copy in src/test.
        continue-on-error: true
        shell: bash
        run: |
          y=$(date -u +%Y)
          for year in $y $((y + 1)); do
            if curl -sfL --max-time 30 "https://api.jolpi.ca/ergast/f1/$year.json?limit=100" -o "$RUNNER_TEMP/cal.json" \
              && jq -e '.MRData.RaceTable.Races | length > 0' "$RUNNER_TEMP/cal.json" > /dev/null; then
              cp "$RUNNER_TEMP/cal.json" "app/src/main/assets/calendar-$year.json"
              echo "Bundled calendar $year: $(jq '.MRData.RaceTable.Races | length' "$RUNNER_TEMP/cal.json") rounds"
            else
              echo "Calendar $year not available; keeping what's committed."
            fi
          done

      - name: Test and build
        # One Gradle run (kept warm for the live check below) instead of three cold ones.
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testDebugUnitTest assembleRelease 2>&1 | tee build.log

      # GitHub keeps 10 error annotations per step, so compile errors are reported in batches.
      - name: Report errors (1-10)
        if: failure()
        shell: bash
        run: |
          { grep -E "^e: |error:|ERROR|expected:<|Exception at|FAILED$" build.log; grep -A 10 "What went wrong" build.log; } \
            | grep -v "^--$" | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | sed 's#/home/runner/work/[^/]*/[^/]*/##' \
            | awk 'NF && !seen[$0]++' > errors.txt || true
          { echo '### Build errors'; echo '```'; head -200 errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,10p' errors.txt | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Report errors (11-20)
        if: failure()
        run: sed -n '11,20p' errors.txt | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Report errors (21-30)
        if: failure()
        run: sed -n '21,30p' errors.txt | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Report errors (31-40)
        if: failure()
        run: sed -n '31,40p' errors.txt | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Report errors (41-50)
        if: failure()
        run: sed -n '41,50p' errors.txt | while IFS= read -r l; do echo "::error::${l}"; done

      - name: Library versions in this build
        continue-on-error: true
        run: |
          v=$(./gradlew -q :app:dependencyInsight --configuration releaseRuntimeClasspath --dependency io.coil-kt.coil3:coil-compose 2>/dev/null | grep -o 'coil-compose:[0-9][0-9.]*' | head -1)
          kb=$(( $(stat -c %s app/build/outputs/apk/release/app-release.apk) / 1024 ))
          echo "::notice::Build: $v, APK ${kb} KB"

      - name: Lint report
        # Android's own checks (manifest, API levels, resources, accessibility). A report only:
        # it never fails the build. The full list is in the run summary.
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew lintDebug > /dev/null 2>&1 || true
          f=app/build/reports/lint.txt
          [ -f "$f" ] || { echo "::warning::No lint report"; exit 0; }
          summary=$(grep -E '^[0-9]+ errors?, [0-9]+ warnings?' "$f" | tail -1)
          echo "::notice title=Lint::${summary:-No issues}"
          grep -E ': Error: ' "$f" | head -10 | sed 's#^.*/app/src/#app/src/#' | while IFS= read -r l; do echo "::warning title=Lint error::$l"; done
          { echo '### Lint'; echo '```'; head -300 "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk f1pro.apk

      - name: Live feed check
        continue-on-error: true
        env:
          LIVE_CHECK: "1"
        run: ./gradlew testDebugUnitTest --tests app.f1pro.LiveCheck --rerun

      - name: Data the app shows as fact
        # Every ❌ line (photos, codes, team ids, driver matching) becomes an error on the run.
        if: always()
        run: |
          f=app/build/live-check.md
          [ -f "$f" ] || f=build/live-check.md
          [ -f "$f" ] || { echo "::warning::No live check report"; exit 0; }
          grep '❌' "$f" | sed 's/^- ❌ //' | while IFS= read -r l; do echo "::error title=Live data::$l"; done
          # The whole report as one notice (a run shows only 10 annotations of each kind).
          echo "::notice title=Live data::$(grep '^- ' "$f" | sed 's/^- //' | sed ':a;N;$!ba;s/\n/%0A/g')"

      - name: Keep the APK with the run
        uses: actions/upload-artifact@v4
        with:
          name: f1pro-apk
          path: f1pro.apk
          retention-days: 14

      - name: Release notes
        run: |
          {
            echo "Tap **f1pro.apk** below on your phone to install or update."
            echo
            # What's new: commit titles since the previous release tag.
            prev=$(git describe --tags --abbrev=0 --match 'v2.0.*' HEAD^ 2>/dev/null || true)
            # Highlights: the hand-written, people-facing list in whatsnew.md, when it was
            # updated for this release. The app's "What's new" popup shows these.
            if [ -f whatsnew.md ] && { [ -z "$prev" ] || ! git diff --quiet "$prev" HEAD -- whatsnew.md; }; then
              echo "### Highlights"
              grep '^- ' whatsnew.md | head -10
              echo
            fi
            if [ -n "$prev" ]; then
              echo "### What's new since $prev"
              git log --no-merges --pretty='- %s' "$prev..HEAD" | head -25
              echo
            fi
            echo "F1 Schedule Pro 2.0 — the native Android app. Built from ${GITHUB_SHA}."
            echo
            cat app/build/live-check.md 2>/dev/null || echo "_Live feed check didn't complete._"
          } > notes.md

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: F1 Schedule Pro 2.0.${{ github.run_number }}
          body_path: notes.md
          files: f1pro.apk
          make_latest: true
